name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-assets:
    name: Validate static assets and SQL artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required static files exist
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "Landing Page.html"
            "frontend/admin/index.html"
            "frontend/admin/login.html"
            "backend/server.js"
            "backend/database.js"
            "backend/package.json"
            "backend/package-lock.json"
            "sql/schema.sql"
            "sql/seed.sql"
            "sql/queries.sql"
          )
          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "Missing or empty required file: $f" >&2
              exit 1
            fi
            echo "ok: $f"
          done

      - name: Verify image directory is present and non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -d image
          count=$(find image -type f | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "image/ directory must contain at least one asset" >&2
            exit 1
          fi
          echo "image assets: $count"

  backend-smoke:
    name: Backend smoke tests
    needs: validate-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check backend sources
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/server.js
          node --check backend/database.js

      - name: Start API and run smoke checks
        shell: bash
        run: |
          set -euo pipefail

          node --experimental-sqlite backend/server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..40}; do
            if curl -fsS "http://127.0.0.1:3000/api/blood-groups" > /dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "API failed to become ready within the timeout window" >&2
            echo "----- server.log -----"
            cat server.log || true
            exit 1
          fi

          echo "API is ready, exercising endpoints..."
          curl -fsS "http://127.0.0.1:3000/api/stats" -o stats.json
          curl -fsS "http://127.0.0.1:3000/api/blood-groups" -o blood-groups.json
          curl -fsS "http://127.0.0.1:3000/api/inventory/summary" -o inventory-summary.json
          curl -fsS "http://127.0.0.1:3000/api/donors" -o donors.json

          node -e "
            const fs = require('fs');
            const stats = JSON.parse(fs.readFileSync('stats.json', 'utf8'));
            if (!stats.success || !stats.data || typeof stats.data.totalDonors !== 'number') {
              console.error('stats payload failed validation');
              process.exit(1);
            }
            const groups = JSON.parse(fs.readFileSync('blood-groups.json', 'utf8'));
            if (!groups.success || !Array.isArray(groups.data) || groups.data.length === 0) {
              console.error('blood-groups payload failed validation');
              process.exit(1);
            }
            const inv = JSON.parse(fs.readFileSync('inventory-summary.json', 'utf8'));
            if (!inv.success || !Array.isArray(inv.data)) {
              console.error('inventory summary payload failed validation');
              process.exit(1);
            }
            const donors = JSON.parse(fs.readFileSync('donors.json', 'utf8'));
            if (!donors.success || !Array.isArray(donors.data)) {
              console.error('donors payload failed validation');
              process.exit(1);
            }
            console.log('All smoke endpoints validated successfully.');
          "

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy live site
    if: github.event_name != 'pull_request'
    needs:
      - validate-assets
      - backend-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp "Landing Page.html" "dist/Landing Page.html"
          cp "Landing Page.html" "dist/index.html"

          cp -R image dist/image
          cp -R frontend dist/frontend

          touch dist/.nojekyll

          echo "----- dist contents -----"
          ls -la dist
          echo "----- dist/frontend/admin -----"
          ls -la dist/frontend/admin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment URL
        shell: bash
        run: |
          echo "Live site deployed to: ${{ steps.deployment.outputs.page_url }}"
