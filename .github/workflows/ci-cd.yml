name: Deploy to Vercel (Production)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# Deploy to Vercel
# Requires secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID,
#                   SUPABASE_URL, SUPABASE_SERVICE_KEY
# ─────────────────────────────────────────────────────────────
jobs:
  deploy-vercel:
    name: "Deploy to Vercel"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets are present
        id: gate
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "════════════════════════════════════════════════"
            echo "  ⚠️  VERCEL DEPLOYMENT SKIPPED"
            echo "  Add these secrets in GitHub → Settings → Secrets → Actions:"
            echo "  VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            echo "════════════════════════════════════════════════"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ All Vercel secrets present — proceeding with deploy"
          fi

      - name: Install Vercel CLI
        if: steps.gate.outputs.skip != 'true'
        run: npm install -g vercel@latest --silent

      - name: Push Supabase env vars to Vercel
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          V_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          V_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          push_env() {
            local KEY="$1" VALUE="$2"
            [ -z "$VALUE" ] && echo "⚠️  $KEY is empty — skipping" && return
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"${KEY}\",\"value\":\"${VALUE}\",\"type\":\"encrypted\",\"target\":[\"production\"]}")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || [ "$HTTP" = "409" ]; then
              echo "✅ ${KEY} pushed (HTTP $HTTP)"
            else
              echo "⚠️  ${KEY} returned HTTP $HTTP — may already exist, continuing"
            fi
          }

          push_env "SUPABASE_URL"         "$V_SUPABASE_URL"
          push_env "SUPABASE_SERVICE_KEY" "$V_SUPABASE_SERVICE_KEY"

      - name: Pull Vercel project metadata
        if: steps.gate.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build for production
        if: steps.gate.outputs.skip != 'true'
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel
        if: steps.gate.outputs.skip != 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}" 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "❌ Could not extract deployment URL" >&2
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed: $DEPLOY_URL"

      - name: Smoke check production endpoint
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo "Polling $DEPLOY_URL/api/blood-groups ..."
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/api/blood-groups")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Live (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/15: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Endpoint did not return 200 within 150s" >&2
          exit 1

      - name: Deployment summary
        if: steps.gate.outputs.skip != 'true' && success()
        run: |
          echo "============================================="
          echo "  Blood Bank API — LIVE"
          echo "  URL: ${{ steps.deploy.outputs.url }}"
          echo "============================================="
