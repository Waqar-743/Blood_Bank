name: CI/CD — Blood Bank Backend + Deploy to Vercel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# JOB 1 — Validate required files exist
# ─────────────────────────────────────────────────────────────
jobs:
  validate-assets:
    name: "🗂 Validate required files"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "Landing Page.html"
            "frontend/admin/index.html"
            "frontend/admin/login.html"
            "backend/server.js"
            "backend/supabase.js"
            "backend/package.json"
            "backend/package-lock.json"
            "vercel.json"
            "sql/supabase_schema.sql"
            "sql/supabase_seed.sql"
          )
          ALL_OK=true
          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "❌ Missing or empty: $f" >&2
              ALL_OK=false
            else
              echo "✅ ok: $f"
            fi
          done
          [ "$ALL_OK" = true ] || exit 1

# ─────────────────────────────────────────────────────────────
# JOB 2 — Backend: install → syntax check → live smoke test
# ─────────────────────────────────────────────────────────────
  backend-smoke:
    name: "🧪 Backend smoke test"
    needs: validate-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --prefer-offline

      - name: Syntax check (Node parse)
        run: |
          node --check backend/server.js
          node --check backend/supabase.js
          echo "✅ Syntax OK"

      - name: Start server & smoke test live endpoints
        shell: bash
        run: |
          set -euo pipefail

          # If secrets are absent (fork PRs), do syntax-only run
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "⚠️  Supabase secrets not set — syntax-only pass (no live test)"
            exit 0
          fi

          # Start server in background
          node backend/server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # Wait up to 30s for /api/blood-groups to respond
          echo "Waiting for server on :3000 ..."
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3000/api/blood-groups" > /dev/null 2>&1; then
              READY=1
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "❌ Server failed to start within 30s" >&2
            cat server.log >&2
            exit 1
          fi

          # Hit every critical endpoint
          echo "Running endpoint checks..."
          curl -fsS http://127.0.0.1:3000/api/blood-groups     -o blood-groups.json
          curl -fsS http://127.0.0.1:3000/api/inventory/summary -o inventory.json
          curl -fsS http://127.0.0.1:3000/api/donors            -o donors.json
          curl -fsS http://127.0.0.1:3000/api/stats             -o stats.json

          # Validate JSON shapes
          node - <<'EOF'
          const fs = require('fs');
          const checks = [
            ['blood-groups', d => d.success && Array.isArray(d.data)],
            ['inventory',    d => d.success && (Array.isArray(d.data) || typeof d.data === 'object')],
            ['donors',       d => d.success && Array.isArray(d.data)],
            ['stats',        d => d.success && typeof d.data === 'object' && 'totalDonors' in d.data],
          ];
          let allOk = true;
          for (const [name, fn] of checks) {
            let d;
            try { d = JSON.parse(fs.readFileSync(name + '.json', 'utf8')); }
            catch (e) { console.error('FAIL (parse):', name, e.message); allOk = false; continue; }
            if (!fn(d)) {
              console.error('FAIL:', name, JSON.stringify(d).slice(0, 300));
              allOk = false;
            } else {
              console.log('PASS:', name);
            }
          }
          if (!allOk) process.exit(1);
          EOF

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore

# ─────────────────────────────────────────────────────────────
# JOB 3 — Deploy backend to Vercel (push to main only)
#
# Required GitHub Secrets → Settings → Secrets → Actions:
#   VERCEL_TOKEN         — vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID        — vercel.com → Team Settings → General
#   VERCEL_PROJECT_ID    — vercel.com → Project → Settings → General
#   SUPABASE_URL         — https://<ref>.supabase.co
#   SUPABASE_SERVICE_KEY — service_role key (Supabase dashboard → Settings → API)
# ─────────────────────────────────────────────────────────────
  deploy-vercel:
    name: "🚀 Deploy to Vercel"
    if: github.event_name != 'pull_request'
    needs: [validate-assets, backend-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # VERCEL_TOKEN at job level — Vercel CLI auto-detects it for ALL steps
    # No need to pass --token on every command
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest --silent

      - name: Verify VERCEL_TOKEN is set
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "❌ VERCEL_TOKEN is not set in GitHub → Settings → Secrets → Actions" >&2
            exit 1
          fi
          echo "✅ VERCEL_TOKEN is present (${#VERCEL_TOKEN} chars)"

      - name: Push Supabase env vars to Vercel project
        shell: bash
        env:
          V_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          V_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          push_env() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "⚠️  $name is empty — skipping"
              return
            fi
            # Remove existing (ignore error if not found), then add fresh value
            vercel env rm "$name" production --yes 2>/dev/null || true
            printf '%s' "$value" | vercel env add "$name" production
            echo "✅ Pushed $name to Vercel"
          }

          push_env "SUPABASE_URL"         "$V_SUPABASE_URL"
          push_env "SUPABASE_SERVICE_KEY" "$V_SUPABASE_SERVICE_KEY"

      - name: Pull Vercel project metadata
        run: vercel pull --yes --environment=production

      - name: Build for production
        run: vercel build --prod

      - name: Deploy prebuilt artifact to Vercel
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "❌ Could not extract deployment URL" >&2
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deploy URL: $DEPLOY_URL"

      - name: Smoke check production endpoint
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo "Polling $DEPLOY_URL/api/blood-groups ..."
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/api/blood-groups")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production endpoint live (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/15: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "❌ Production endpoint did not return 200 within 150s" >&2
          exit 1

      - name: "📢 Deployment summary"
        if: success()
        run: |
          echo ""
          echo "============================================="
          echo "  🩸 Blood Bank API — LIVE"
          echo "  URL: ${{ steps.deploy.outputs.url }}"
          echo "  Endpoints:"
          echo "    /api/blood-groups"
          echo "    /api/donors"
          echo "    /api/donations"
          echo "    /api/inventory"
          echo "    /api/stats"
          echo "============================================="
